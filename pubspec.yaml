name: worldtalk_ai
description: "WorldTalk AI — Universal Real-Time Language Translation Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # State Management
  flutter_riverpod: ^2.4.9

  # Storage
  shared_preferences: ^2.2.2

  # HTTP & API
  http: ^1.2.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
