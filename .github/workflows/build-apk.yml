name: Build Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs: {}

jobs:
  build:
    name: Build Signed AAB + APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Generate Android project
        run: flutter create --org com.worldtalk --project-name worldtalk_ai .

      - name: Patch Android permissions
        run: python3 -c "import os; m='<?xml version=\"1.0\" encoding=\"utf-8\"?><manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"com.worldtalk.worldtalk_ai\"><uses-permission android:name=\"android.permission.INTERNET\"/><uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/><uses-permission android:name=\"android.permission.RECORD_AUDIO\"/><application android:label=\"WorldTalk AI\" android:icon=\"@mipmap/ic_launcher\" android:usesCleartextTraffic=\"true\" android:allowBackup=\"true\"><activity android:name=\".MainActivity\" android:exported=\"true\" android:launchMode=\"singleTop\" android:theme=\"@style/LaunchTheme\" android:configChanges=\"orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode\" android:hardwareAccelerated=\"true\" android:windowSoftInputMode=\"adjustResize\"><meta-data android:name=\"io.flutter.embedding.android.NormalTheme\" android:resource=\"@style/NormalTheme\"/><intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity><meta-data android:name=\"flutterEmbedding\" android:value=\"2\"/></application></manifest>'; open('android/app/src/main/AndroidManifest.xml','w').write(m)"

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore and setup signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/worldtalk-keystore.jks
          python3 -c "
          import os
          with open('android/key.properties','w') as f:
              f.write('storeFile=worldtalk-keystore.jks\n')
              f.write(f'storePassword={os.environ[\"KEYSTORE_PASSWORD\"]}\n')
              f.write(f'keyAlias={os.environ[\"KEY_ALIAS\"]}\n')
              f.write(f'keyPassword={os.environ[\"KEY_PASSWORD\"]}\n')
          "

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: worldtalk-ai-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: worldtalk-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.0-build${{ github.run_number }}" \
            build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Build #${{ github.run_number }} — Signed AAB + APK" \
            --notes "Signed release build #${{ github.run_number }}

**AAB**: app-release.aab
**APK**: app-release.apk" \
            --prerelease
